<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <title>MemoryFlow — Игра на внимание</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <a class="logo" href="trainers.html">MemoryFlow</a>
    <button id="themeToggle" class="btn btn-ghost" type="button">Сменить тему</button>
  </header>

  <main class="container">
    <section class="card">
      <h1>Игра на внимание</h1>
      <p>Найдите все подсвеченные клетки и нажмите на них.</p>
      <button id="attentionStart" class="btn btn-primary" type="button">Старт</button>
      <p class="message" id="attentionMessage"></p>
      <div class="game-board attention-cells" id="attentionBoard"></div>
      <div class="row">
        <a class="btn" href="trainers.html">К тренажерам</a>
        <a class="btn" href="profile.html">В профиль</a>
      </div>
    </section>
  </main>

  <footer class="footer">MemoryFlow © 2026</footer>
  <script src="script.js"></script>
  <script src="game-attention.js"></script>
</body>
</html>
