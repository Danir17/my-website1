<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <title>MemoryFlow — Игра на память</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <a class="logo" href="trainers.html">MemoryFlow</a>
    <button id="themeToggle" class="btn btn-ghost" type="button">Сменить тему</button>
  </header>

  <main class="container">
    <section class="card">
      <h1>Игра на память</h1>
      <p>Запомните последовательность цифр и повторите ее.</p>
      <button id="memoryStart" class="btn btn-primary" type="button">Показать последовательность</button>
      <div class="memory-sequence" id="memorySequence">-</div>
      <label class="field">Ваш ответ
        <input id="memoryInput" type="text" placeholder="Введите цифры">
      </label>
      <button id="memoryCheck" class="btn" type="button">Проверить</button>
      <p class="message" id="memoryMessage"></p>
      <div class="row">
        <a class="btn" href="trainers.html">К тренажерам</a>
        <a class="btn" href="profile.html">В профиль</a>
      </div>
    </section>
  </main>

  <footer class="footer">MemoryFlow © 2026</footer>
  <script src="script.js"></script>
  <script src="game-memory.js"></script>
</body>
</html>
