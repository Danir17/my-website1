<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <title>MemoryFlow — Таблица Шульте</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <a class="logo" href="trainers.html">MemoryFlow</a>
    <button id="themeToggle" class="btn btn-ghost" type="button">Сменить тему</button>
  </header>

  <main class="container">
    <section class="card">
      <h1>Таблица Шульте</h1>
      <p>Нажимайте числа по порядку от 1 до 25 как можно быстрее — тренирует периферическое зрение и внимание.</p>
      <button id="schulteStart" class="btn btn-primary" type="button">Новая таблица</button>
      <div class="schulte-meta">
        <span id="schulteNext">Следующее: —</span>
        <span id="schulteTimer">Время: 0.0 с</span>
      </div>
      <p class="message" id="schulteMessage"></p>
      <div class="game-board schulte-board" id="schulteBoard" aria-label="Таблица Шульте"></div>
      <div class="row">
        <a class="btn" href="trainers.html">К тренажёрам</a>
        <a class="btn" href="profile.html">В профиль</a>
      </div>
    </section>
  </main>

  <footer class="footer">MemoryFlow © 2026</footer>
  <script src="script.js"></script>
  <script src="game-schulte.js"></script>
</body>
</html>
